name: KnowFlow AI — CD

on:
  workflow_run:
    workflows: ["KnowFlow AI — CI"]
    types:
      - completed
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: cd-production
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------------------
  # Step 1: Deploy Backend to Render (via Deploy Hook)
  # ---------------------------------------------------------------------------
  deploy-backend:
    name: Deploy Backend to Render
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Trigger Render Web Service Deployment
        run: |
          if [ -z "${{ secrets.RENDER_DEPLOY_HOOK_URL }}" ]; then
            echo "⚠️ RENDER_DEPLOY_HOOK_URL secret is not configured. Skipping Render webhook dispatch."
            exit 0
          fi

          echo "🚀 Triggering Render deploy webhook..."
          RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}" -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}")
          HTTP_STATUS=$(echo "$RESPONSE" | grep "HTTP_STATUS:" | cut -d':' -f2)
          BODY=$(echo "$RESPONSE" | grep -v "HTTP_STATUS:")

          echo "Response: $BODY"
          if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 300 ]; then
            echo "✅ Render deployment successfully triggered (HTTP $HTTP_STATUS)!"
          else
            echo "❌ Failed to trigger Render deployment (HTTP $HTTP_STATUS)."
            exit 1
          fi

  # ---------------------------------------------------------------------------
  # Step 2: Deploy Frontend to Vercel
  # ---------------------------------------------------------------------------
  deploy-frontend:
    name: Deploy Frontend to Vercel
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy to Vercel (Production)
        uses: amondnet/vercel-action@v25
        if: ${{ env.VERCEL_TOKEN != '' }}
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          working-directory: ./frontend
          vercel-args: '--prod'

  # ---------------------------------------------------------------------------
  # Step 3: Deployment Summary
  # ---------------------------------------------------------------------------
  deployment-summary:
    name: Publish Deployment Summary
    needs: [deploy-backend, deploy-frontend]
    runs-on: ubuntu-latest
    if: always()

    steps:
      - name: Post Summary to GitHub Actions Step Summary
        run: |
          echo "### 🚀 KnowFlow AI Production Deployment" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Trigger**: \`${{ github.event_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **CI Result**: \`${{ github.event.workflow_run.conclusion || 'Manual Dispatch' }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Render Backend Status**: ${{ needs.deploy-backend.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Vercel Frontend Status**: ${{ needs.deploy-frontend.result }}" >> $GITHUB_STEP_SUMMARY
