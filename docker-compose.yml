version: '3.8'

services:
  # PostgreSQL with pgvector extension for relational data and vector similarity search
  postgres:
    image: pgvector/pgvector:pg16
    container_name: knowflow_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-knowflow_db}
      POSTGRES_USER: ${POSTGRES_USER:-knowflow_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-knowflow_secret}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-knowflow_user} -d ${POSTGRES_DB:-knowflow_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Redis for caching, rate limiting, and Celery task broker
  redis:
    image: redis:7-alpine
    container_name: knowflow_redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
